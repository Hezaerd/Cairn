[package]
name = "cairn-desktop"
version = "0.1.0"
description = "Cairn desktop application"
authors = ["Hezaerd"]
edition = "2024"

[lib]
name = "cairn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
cairn-local-bridge = { path = "../../../crates/local-bridge" }
tauri-plugin-single-instance = "2"
cairn-vault = { path = "../../../crates/vault" }
zeroize = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
cairn-favicon = { path = "../../../crates/favicon" }
base64 = "0.22"
cairn-protocol = { path = "../../../crates/protocol" }
getrandom = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hmac = "0.12"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false }
tempfile = "3"
