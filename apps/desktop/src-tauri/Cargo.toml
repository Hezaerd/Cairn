[package]
name = "cairn-desktop"
version = "0.1.0"
description = "Cairn desktop application"
authors = ["Hezaerd"]
edition = "2024"

[lib]
name = "cairn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cairn-local-bridge = { path = "../../../crates/local-bridge" }
tauri-plugin-single-instance = "2"
cairn-vault = { path = "../../../crates/vault" }
zeroize = "1"
tokio = { version = "1", features = ["time"] }
