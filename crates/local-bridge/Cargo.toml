[package]
name = "cairn-local-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
cairn-protocol = { path = "../protocol" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_RemoteDesktop"] }
