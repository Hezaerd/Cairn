[package]
name = "cairn-app"
version = "0.1.0"
edition = "2024"

[dependencies]
cairn-local-bridge = { path = "../local-bridge" }
cairn-vault = { path = "../vault" }
zeroize = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
cairn-favicon = { path = "../favicon" }
base64 = "0.22"
cairn-protocol = { path = "../protocol" }
getrandom = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hmac = "0.12"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
rxing = { version = "0.9.3", default-features = false, features = ["qrcode", "decoders", "multi_barcode_readers", "encoding_rs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false }
tempfile = "3"
