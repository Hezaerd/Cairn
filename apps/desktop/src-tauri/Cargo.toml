[package]
name = "cairn-desktop"
version = "0.1.0"
description = "Cairn desktop application"
authors = ["Hezaerd"]
edition = "2024"

[lib]
name = "cairn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
cairn-vault = { path = "../../../crates/vault" }
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
cairn-app = { path = "../../../crates/app" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[[test]]
name = "rune-update-compat"
path = "../../desktop-rune/packaging/tauri-compat.rs"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
