[package]
name = "cairn-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]

base64 = "0.22"
cairn-app = { path = "../../crates/app" }
cairn-vault = { path = "../../crates/vault" }
chrono = "0.4"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
minisign-verify = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "system-proxy"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d", default-features = false, features = ["accessibility", "native-file-dialog"] }
rune-i18n = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d", default-features = false }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
url = { version = "2", features = ["serde"] }
zeroize = "1"

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }

[build-dependencies]
rune-i18n = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d", features = ["codegen"] }

[target.'cfg(windows)'.dependencies]
winshell = { git = "https://github.com/Hezaerd/winshell", rev = "7e065cfbe83e9fddfcf8bab651fbd58b96ef0de9" }
