[package]
name = "cairn-vault"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
atomic-write-file = "0.3.1"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
url = "2"
